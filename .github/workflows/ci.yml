name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # The suite takes well under a minute. Without a limit, a hang runs to GitHub's
    # six-hour default.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      # Deno is required by the run_api_code sandbox suites.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm build
      - run: pnpm test

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t portolan:ci .
      - name: doctor runs inside the image
        run: |
          mkdir -p data
          printf 'database:\n  path: /data/portolan.db\n' > data/config.yaml
          chmod 600 data/config.yaml
          # The image runs as the node user (uid 1000); the bind mount must be its.
          sudo chown -R 1000:1000 data
          docker run --rm -v "$PWD/data:/data" portolan:ci doctor
