openapi: 3.0.3
info:
  title: Recursive Tree API
  version: '1.0.0'
  description: Exercises recursive schemas, which must not be infinitely dereferenced.
servers:
  - url: https://tree.example.com
paths:
  /nodes:
    get:
      operationId: listNodes
      summary: List tree nodes
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Node'
components:
  schemas:
    Node:
      type: object
      properties:
        id:
          type: string
        children:
          type: array
          items:
            $ref: '#/components/schemas/Node'
        parent:
          $ref: '#/components/schemas/Node'
